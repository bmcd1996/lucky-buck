<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Fossil Finders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@500;700&display=swap">
<style>
/* Layout: the approved ticket art fills the width; a slim control bar sits right under it. Single dark jungle look by choice. */
:root {
  --bg: #17110c;
  --panel: #241a12;

  --bad: #e2785c;

  -webkit-touch-callout: none;

.ticket > img.stands { position: absolute; inset: auto; left: 3.516%; top: 44.922%; width: 25%; height: 39.779%; pointer-events: none; }
.flipbadge { position: absolute; left: 83.789%; top: 0.781%; width: 15.137%; height: 8.203%; padding: 0; border: 0; background: url(fossil-finders-flip.png?v=382) center / 100% 100% no-repeat; cursor: pointer; z-index: 5; min-height: 0; border-radius: 12%; }
.flipbadge:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.ticket.flipped .back { display: block; }

.cells { position: absolute; inset: 0; }
.cell { position: absolute; border-radius: 8% / 12%; overflow: hidden; container-type: size; }
.cell canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cell .under { filter: brightness(0.42) saturate(0.85); }
.cell canvas.fossil { image-rendering: pixelated; }
.fossil-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; image-rendering: pixelated; }
.ticket.flipped .fossil-overlay { display: none; }
.ticket { will-change: transform; }
.cell .cover { touch-action: none; cursor: crosshair; }
.cell .cover.gone { display: none; }
.cell.locked .cover { pointer-events: none; cursor: default; }
.cell .letter {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--display); font-size: 72cqh; line-height: 1; color: var(--fg);
  text-shadow: 0 0.06em 0 #1b0f06, 0 0 0.12em #1b0f06;
  pointer-events: none;
}
.cell.unpicked .letter { opacity: 0.45; }

.bar { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.prize { font-family: var(--display); font-size: 2.1rem; line-height: 1; min-height: 1em; font-variant-numeric: tabular-nums; }
.prize.win { color: var(--good); }
.prize.lose { color: var(--muted); }
.stats { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 700; }
.buttons { display: flex; gap: 8px; }
button {
  font: 700 0.95rem var(--body); color: #2a1606; background: var(--accent);
  border: 0; border-radius: 8px; padding: 12px 16px; min-height: 44px; cursor: pointer;
}
button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
button:disabled { opacity: 0.35; cursor: default; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>

<body>
<div class="wrap">
  <div class="ticket" id="ticket">

    <img class="stands" src="fossil-finders-stands.png?v=384" alt="">
    <div class="cells" id="cells"></div>
    <button class="flipbadge" id="flipBadge" type="button" aria-label="Flip the ticket over"></button>
  </div>
  <div class="bar">
    <div class="prize" id="prize" aria-live="polite"></div>
    <div class="buttons">
      <button id="newBtn" type="button" disabled>New Ticket</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>

    if (fx2 === 'glow') { shake(8, now); for (let n = 0; n < 26; n++) effects.push({ x: A.x + Math.random() * A.cv.width, y: A.y - 20 - Math.random() * 40, vx: (Math.random() - .5) * 30, vy: 40 + Math.random() * 60, t0: now + Math.random() * 300, life: 700, col: Math.random() < .5 ? '#fff6c8' : '#ffd34a', size: 5 }); }
    if (fx2 === 'stomp') { shake(15, now); puff(A.x + A.cv.width * .3, C_FEET - 4, 18, 120, now); puff(A.x + A.cv.width * .7, C_FEET - 4, 18, 120, now); }
    if (fx2 === 'storm') { shake(12, now); sparks(headX, headY + 20, 18, now); }
  }
  // the fossil in flight
  if (flying) {
    const f = flying.f, pc = pieceOf(f, now), cv = pc.cv, r = cellRect(f.r, f.c);
    const t = Math.min(1, (now - flying.t0) / HOP_MS);
    const q = hop({ x: r.x + r.w / 2, y: r.y + r.h / 2 }, { x: pc.x + cv.width / 2, y: pc.y + cv.height / 2 }, t);
    if (q.second && !flying.puffed) { flying.puffed = true; puff(q.x, q.y + cv.height / 2, 6, 60, now); }
    drawSprite(cv, q.x - cv.width / 2, q.y - cv.height / 2, pc.mirror);
    if (t >= 1) landed(f, now);
  }
  // dust and sparks
  effects = effects.filter((e) => now - e.t0 < e.life);
  for (const e of effects) {
    if (now < e.t0) continue;
    const k = (now - e.t0) / e.life, dt = (now - e.t0) / 1000;
    octx.globalAlpha = 1 - k; octx.fillStyle = e.col;
    if (e.ring) { const rr = 20 + 170 * (1 - Math.pow(1 - k, 2)); for (let a = 0; a < 48; a++) { const t = a / 48 * Math.PI * 2;
      octx.fillRect(Math.round((e.x + Math.cos(t) * rr) / 4) * 4, Math.round((e.y + Math.sin(t) * rr * .6) / 4) * 4, 6, 6); } continue; }
    octx.fillRect(Math.round((e.x + e.vx * dt) / 2) * 2, Math.round((e.y + e.vy * dt + (e.nograv ? 0 : 160 * dt * dt)) / 2) * 2, e.size, e.size);
  }
  octx.globalAlpha = 1;
  // money pop-ups
  floaters = floaters.filter((f) => now - f.t0 < (f.big ? 1600 : 1300));
  for (const fl of floaters) {
    if (now < fl.t0) continue;
    const life = fl.big ? 1600 : 1300, k = (now - fl.t0) / life, y = fl.y - (fl.big ? 60 : 46) * (1 - Math.pow(1 - k, 2));
    const grow = fl.big ? 1 + .25 * Math.sin(Math.min(1, k * 4) * Math.PI) : 1, size = Math.round((fl.big ? 78 : 54) * grow);
    octx.globalAlpha = k < .6 ? 1 : 1 - (k - .6) / .4;
    octx.font = `400 ${size}px "Lilita One", "Arial Black", sans-serif`; octx.textAlign = 'center'; octx.lineJoin = 'round';
    octx.lineWidth = fl.big ? 13 : 10; octx.strokeStyle = '#1c0f08'; octx.strokeText(fl.text, fl.x, y);
    octx.fillStyle = fl.big ? '#ffb12a' : '#ffd34a'; octx.fillText(fl.text, fl.x, y);
  }
  octx.globalAlpha = 1;
  if (idleWaiters.length && idle(now)) { const w = idleWaiters; idleWaiters = []; w.forEach((fn) => fn()); }
  requestAnimationFrame(loop);
}

window.FF_FOSSILS = {
  init(ticket, cells) {
    ticketEl = ticket; cellsEl = cells; build();
    overlay = document.createElement('canvas'); overlay.className = 'fossil-overlay'; overlay.width = 1024; overlay.height = 1536;
    octx = overlay.getContext('2d'); octx.imageSmoothingEnabled = false;
    ticket.append(overlay);
    if (!running) { running = true; requestAnimationFrame(loop); }
  },
  setLook(v) { ancientLook = v; const c = makeCarno(); CARNO = { parts: c.parts.map((q) => cropFrame(q.map, q.opt)), ancient: cropFrame(c.ancient) }; return v; },
  setSkull(v) { carnoSkull = v; const c = makeCarno(); CARNO = { parts: c.parts.map((q) => cropFrame(q.map, q.opt)), ancient: cropFrame(c.ancient) }; return v; },
  setAncientFx(name) { if (FX[name]) ancientFx = name; return ancientFx; },
  reset() { next = { P: 0, C: 0 }; finds = []; placed = []; cPlaced = []; flying = null; effects = []; floaters = []; wins = []; ghosts = []; scootStart = null; scootDone = false; morph = null; idleWaiters = []; },
  // letters that are shown as fossils (other finds stay letters for now)
  has(letter) { return letter === 'P' || letter === 'C'; },
  // a fossil spot: canvas the size of the cell, drawn when its spot is first scratched
  prepCell(cell, w, h, letter) { const cv = document.createElement('canvas'); cv.className = 'fossil'; cv.width = w; cv.height = h; cv.dataset.letter = letter || 'P'; cell.insertBefore(cv, cell.querySelector('.cover')); return cv; },
  // when a fossil spot is first scratched it gets that dinosaur's next piece, so scratching uncovers it
  assign(cell) {
    const cv = cell.querySelector('canvas.fossil'); if (!cv || cv.dataset.i) return;
    const L = cv.dataset.letter, i = next[L]++; if (i >= 4) return;
    cv.dataset.i = String(i);
    const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
    if (L === 'P') { const s = sprites[i]; drawSprite(s.img.cv, (cv.width - s.img.cv.width) / 2, (cv.height - s.img.cv.height) / 2, s.who === 'B', ctx); }
    else { const p = CARNO.parts[i].cv, k = Math.min(1, (cv.width - 12) / p.width, (cv.height - 12) / p.height), w = Math.round(p.width * k), h = Math.round(p.height * k);
      ctx.drawImage(p, Math.round((cv.width - w) / 2), Math.round((cv.height - h) / 2), w, h); }
  },
  onReveal(r, c, cell) {
    const cv = cell.querySelector('canvas.fossil'); if (!cv) return;
    if (!cv.dataset.i) this.assign(cell);
    const i = Number(cv.dataset.i); if (!(i >= 0 && i < 4)) return;
    finds.push({ dino: cv.dataset.letter, i, r, c, cv, t0: performance.now(), left: false });
  },
  ghost(r, c, letter) { ghosts.push({ r, c, letter: letter || 'P' }); },
  whenIdle(fn) { idleWaiters.push(fn); },
  isIdle() { return idle(performance.now()); },
  state() { return { finds: finds.length, placed: placed.length, carno: cPlaced.length, ancient: !!(morph && morph.landed), flying: !!flying, scoot: scootDone ? 'done' : scootStart ? 'moving' : 'middle', wins: wins.map((w) => w.kind) }; },
};
})();
</script>
<script>
if (window.self !== window.top) document.documentElement.classList.add('embedded');
(() => {
  // ---- Ticket geometry, in pixels of the 1024 x 1536 front art ----
  const ART_W = 1024, ART_H = 1536;
  const COLS = [[300, 506], [521, 729], [746, 961]];           // the three dig spots (left label box is not playable)
  const ROWS = [[699, 827], [848, 978], [1000, 1132], [1155, 1292]]; // green, clay, brown, gray

  // ---- Odds (approved design, Nov 10 2026). The simulator's Fossil odds sliders can change them. ----
  // P/C/B = % per spot on ordinary tickets. Special dig sites and amber = % of tickets.
  const DEFAULT_ODDS = { P: 30, C: 30, B: 40, bedP: 8, carno3: 0, ancient: 0, brachy: 0, amber: 3 };
  const SITES = {
    bedP:    { all: { P: .75, B: .15, C: .10 } },                                // lots of Pachy bones
    carno3:  { all: { C: .85, P: .05, B: .10 }, odd: { P: .30, B: .70, C: 0 } },  // 3 rows rich in C, one random row with none
    ancient: { all: { C: .85, P: .05, B: .10 } },                                // every row rich in C
    brachy:  { all: { B: .85, P: .07, C: .08 } },                                // every row rich in B
  };
  const ODDS_KEY = 'fossil-finders-odds';
  let ODDS, ORDINARY;
  function cleanOdds(o) {
    o = o || {};
    if (typeof o.bed === 'number' && typeof o.bedP !== 'number') o = { ...o, bedP: o.bed };   // older saves
    const num = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d);
    const r = {};
    for (const k of ['P', 'C', 'B']) r[k] = num(o[k], 0, 100, DEFAULT_ODDS[k]);
    for (const k of ['bedP', 'carno3', 'ancient', 'brachy']) r[k] = num(o[k], 0, 95, DEFAULT_ODDS[k]);
    r.amber = num(o.amber, 0, 30, DEFAULT_ODDS.amber);
    if (r.P + r.C + r.B <= 0) Object.assign(r, { P: 30, C: 30, B: 40 });
    const sites = r.bedP + r.carno3 + r.ancient + r.brachy;
    if (sites > 95) for (const k of ['bedP', 'carno3', 'ancient', 'brachy']) r[k] = r[k] * 95 / sites;
    return r;
  }
  function applyOdds(o) { ODDS = cleanOdds(o); const t = ODDS.P + ODDS.C + ODDS.B; ORDINARY = { P: ODDS.P / t, C: ODDS.C / t, B: ODDS.B / t }; }
  try { applyOdds(JSON.parse(localStorage.getItem(ODDS_KEY))); } catch (e) { applyOdds(DEFAULT_ODDS); }

  const rnd = () => (crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296);
  const draw = (p) => { let r = rnd(); for (const k in p) { if ((r -= p[k]) < 0) return k; } return Object.keys(p).pop(); };

  // All 12 spots are decided when the ticket is bought and never change afterwards.
  function newBoard() {
    let rows = [ORDINARY, ORDINARY, ORDINARY, ORDINARY], r = rnd() * 100;
    for (const k of ['bedP', 'carno3', 'ancient', 'brachy']) {
      if ((r -= ODDS[k]) < 0) { const st = SITES[k]; rows = [st.all, st.all, st.all, st.all]; if (st.odd) rows[Math.floor(rnd() * 4)] = st.odd; break; }
    }
    const b = rows.map((m) => COLS.map(() => draw(m)));
    if (rnd() < ODDS.amber / 100) b[Math.floor(rnd() * 4)][Math.floor(rnd() * 3)] = 'A';
    return b;
  }

  // Prize for the four picked finds. X in the owner's notes = "any other find".
  function payout(finds) {
    const n = (s) => finds.filter((f) => f === s).length;
    const P = n('P'), C = n('C'), B = n('B'), A = n('A');
    let d = 0;
    if (P === 4) d = 2;            // two Pachys
    else if (P >= 2) d = 1;        // one Pachy
    else if (C === 4) d = 30;      // Ancient Carnotaurus
    else if (C === 3) d = 5;       // Carnotaurus
    else if (B === 4) d = 10;      // Brachiosaurus
    if (A) d += 25;                // amber stacks; at most one per ticket
    return d;
  }

  // Test hook: simulate random players (not shown on the page).
  window.__fossilFinders = {
    newBoard, payout, fossils: () => FF_FOSSILS.state(), board: () => board,
    forceBoard(b) { ticket.classList.remove('flipped'); finishWaiting = false; buildTicket(b); },
    dig(r, c) { const el = cellsEl.children[r * 3 + c]; if (el && el.dig) el.dig(); },
    ancientFx: (name) => FF_FOSSILS.setAncientFx(name),
    skull: (v) => FF_FOSSILS.setSkull(v),
    look: (v) => FF_FOSSILS.setLook(v),
    simulate(n = 10000) {
      const t = {}, cat = { lose: 0, pachy1: 0, pachy2: 0, carno: 0, ancient: 0, brachy: 0, amber: 0 }; let paid = 0;
      for (let i = 0; i < n; i++) {
        const b = newBoard(); const f = b.map((r) => r[Math.floor(rnd() * 3)]);
        const d = payout(f); paid += d; t[d] = (t[d] || 0) + 1;
        const k = (s) => f.filter((x) => x === s).length;
        if (k('A')) cat.amber++;
        else if (k('P') === 4) cat.pachy2++; else if (k('P') >= 2) cat.pachy1++;
        else if (k('C') === 4) cat.ancient++; else if (k('C') === 3) cat.carno++;
        else if (k('B') === 4) cat.brachy++; else cat.lose++;
      }
      const pct = {}; for (const k in t) pct['$' + k] = +(100 * t[k] / n).toFixed(2);
      const share = {}; for (const k in cat) share[k] = cat[k] / n;
      return { tickets: n, percentByPrize: pct, share, avgPaid: +(paid / n).toFixed(3) };
    },
    getOdds: () => ({ ...ODDS }),
    defaults: () => ({ ...DEFAULT_ODDS }),
    setOdds(o) { applyOdds(o); try { localStorage.setItem(ODDS_KEY, JSON.stringify(ODDS)); } catch (e) {} return { ...ODDS }; },
  };
  window.addEventListener('storage', (e) => { if (e.key === ODDS_KEY) { try { applyOdds(JSON.parse(e.newValue)); } catch (err) {} } });

  // ---- Session stats (kept in this browser only) ----
  const KEY = 'fossil-finders-preview-stats';
  let stats = { spent: 0, won: 0 };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s.spent === 'number') stats = s; } catch (e) {}
  const saveStats = () => { try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch (e) {} };
  const money = (v) => (v < 0 ? '−$' : '$') + Math.abs(v);
  function renderStats() {
    const net = stats.won - stats.spent;
    document.getElementById('stats').innerHTML =
      `<span>Spent <b>${money(stats.spent)}</b></span><span>Won <b>${money(stats.won)}</b></span><span>Net <b>${net > 0 ? '+' : ''}${money(net)}</b></span>`;
  }

  // ---- Ticket ----
  const ticket = document.getElementById('ticket');
  const cellsEl = document.getElementById('cells');
  const prizeEl = document.getElementById('prize');
  const newBtn = document.getElementById('newBtn');
  const art = document.getElementById('frontImg');
  const BRUSH = 30; // radius in art pixels
  let board, picks, paidFor, done, finishWaiting = false;
  FF_FOSSILS.init(ticket, cellsEl);

  function buildTicket(forced) {
    board = forced || newBoard(); picks = [null, null, null, null]; paidFor = false; done = false;
    FF_FOSSILS.reset();
    prizeEl.textContent = ''; prizeEl.className = 'prize';
    newBtn.disabled = true;
    cellsEl.innerHTML = '';
    ROWS.forEach(([y0, y1], r) => COLS.forEach(([x0, x1], c) => {
      const w = x1 - x0, h = y1 - y0;
      const cell = document.createElement('div');
      cell.className = 'cell';
      Object.assign(cell.style, { left: x0 / ART_W * 100 + '%', top: y0 / ART_H * 100 + '%', width: w / ART_W * 100 + '%', height: h / ART_H * 100 + '%' });
      const under = document.createElement('canvas'); under.className = 'under';
      const letter = document.createElement('div'); letter.className = 'letter'; letter.textContent = FF_FOSSILS.has(board[r][c]) ? '' : board[r][c];
      const cover = document.createElement('canvas'); cover.className = 'cover';
      for (const cv of [under, cover]) { cv.width = w; cv.height = h; cv.getContext('2d').drawImage(art, x0, y0, w, h, 0, 0, w, h); }
      cell.append(under, letter, cover);
      if (FF_FOSSILS.has(board[r][c])) FF_FOSSILS.prepCell(cell, w, h, board[r][c]);
      cellsEl.append(cell);
      attachScratch(cell, cover, r, c);
    }));
  }

  function rowCells(r) { return [...cellsEl.children].slice(r * 3, r * 3 + 3); }

  function clearedFraction(cv) {
    const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    let clear = 0, total = 0;
    for (let i = 3; i < d.length; i += 4 * 6) { total++; if (d[i] < 40) clear++; }
    return clear / total;
  }

  function attachScratch(cell, cover, r, c) {
    const ctx = cover.getContext('2d', { willReadFrequently: true });
    let last = null, strokes = 0;
    const toArt = (e) => { const b = cover.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * cover.width, (e.clientY - b.top) / b.height * cover.height]; };
    const scratch = (p) => {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = BRUSH * 2;
      ctx.beginPath();
      if (last) { ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); }
      else { ctx.arc(p[0], p[1], BRUSH, 0, Math.PI * 2); ctx.fill(); }
      last = p;
      if (++strokes % 4 === 0) check();
    };
    const check = () => {
      const f = clearedFraction(cover);
      if (picks[r] === null && f > 0.04) choose();
      if (f > 0.55) reveal();
    };
    const choose = () => {
      picks[r] = c;
      if (!paidFor) { paidFor = true; stats.spent += 1; saveStats(); renderStats(); }
      rowCells(r).forEach((el, i) => { if (i !== c) el.classList.add('locked'); });
      if (FF_FOSSILS.has(board[r][c])) FF_FOSSILS.assign(cell);
    };
    cell.dig = () => { if (done || cell.classList.contains('locked') && picks[r] !== c) return; if (picks[r] === null) choose(); ctx.clearRect(0, 0, cover.width, cover.height); reveal(); };
    const reveal = () => {
      if (cover.classList.contains('gone')) return;
      cover.classList.add('gone'); cell.classList.add('locked');
      if (FF_FOSSILS.has(board[r][c])) FF_FOSSILS.onReveal(r, c, cell);
      if (picks.every((p) => p !== null) && rowsRevealed()) finish();
    };
    cover.addEventListener('pointerdown', (e) => {
      if (done || cell.classList.contains('locked')) return;
      e.preventDefault(); cover.setPointerCapture(e.pointerId); last = null; scratch(toArt(e));
    });
    cover.addEventListener('pointermove', (e) => {
      if (!cover.hasPointerCapture(e.pointerId)) return;
      e.preventDefault(); scratch(toArt(e));
    });
    const end = (e) => { if (cover.hasPointerCapture(e.pointerId)) { cover.releasePointerCapture(e.pointerId); check(); } last = null; };
    cover.addEventListener('pointerup', end);
    cover.addEventListener('pointercancel', end);
  }

  function rowsRevealed() {
    return picks.every((c, r) => c !== null && rowCells(r)[c].querySelector('.cover').classList.contains('gone'));
  }

  function finish() {
    if (done) return;
    if (!FF_FOSSILS.isIdle()) { if (!finishWaiting) { finishWaiting = true; FF_FOSSILS.whenIdle(() => { finishWaiting = false; finish(); }); } return; }
    done = true;
    const finds = picks.map((c, r) => board[r][c]);
    const d = payout(finds);
    stats.won += d; saveStats(); renderStats();
    prizeEl.textContent = '$' + d;
    prizeEl.className = 'prize ' + (d > 0 ? 'win' : 'lose');
    // Show the 8 spots that weren't picked.
    [...cellsEl.children].forEach((el, i) => {
      const r = Math.floor(i / 3), c = i % 3;
      el.classList.add('locked');
      if (picks[r] !== c) { el.classList.add('unpicked'); el.querySelector('.cover').classList.add('gone'); if (FF_FOSSILS.has(board[r][c])) FF_FOSSILS.ghost(r, c, board[r][c]); }
    });
    newBtn.disabled = false;
  }

  newBtn.addEventListener('click', () => { ticket.classList.remove('flipped'); finishWaiting = false; buildTicket(); });
  document.getElementById('flipBadge').addEventListener('click', () => ticket.classList.add('flipped'));
  ticket.querySelector('.back').style.pointerEvents = 'auto';
  ticket.querySelector('.back').addEventListener('click', () => ticket.classList.remove('flipped'));

  const reportHeight = () => { try { parent.postMessage({ fossilFindersHeight: document.querySelector('.wrap').offsetHeight + 4 }, '*'); } catch (e) {} };
  window.addEventListener('resize', reportHeight);
  new ResizeObserver(reportHeight).observe(document.querySelector('.wrap'));

  renderStats();
  const start = () => buildTicket();
  if (art.complete && art.naturalWidth) start(); else art.addEventListener('load', start, { once: true });
})();
</script>
