<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10231c"><title>Secret Squirrels · $2</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{background:transparent;color:#d7e7d7;font-family:system-ui,-apple-system,sans-serif;margin:0}
main{max-width:520px;margin:0 auto;padding:2px 0 18px;text-align:center}
.stage{position:relative;width:min(100%,var(--ticket-w,82vw));max-width:420px;aspect-ratio:1024/1536;border-radius:10px;overflow:hidden;margin:0 auto;filter:drop-shadow(0 7px 12px #0009)}
.stage img{display:block;width:100%;height:100%;object-fit:fill;image-rendering:auto;user-select:none;-webkit-user-drag:none}
.stage img[hidden]{display:none!important}
.inner{position:absolute;inset:0}
/* Same card turn as Lucky Buck: squeeze to edge-on, swap sides at the midpoint, open back up. */
.stage.flipping .inner{animation:ss-card-turn 660ms cubic-bezier(.42,.03,.2,.99) both}
@keyframes ss-card-turn{0%,100%{transform:scaleX(1);filter:brightness(1)}49%,51%{transform:scaleX(.018);filter:brightness(.72)}}
/* Scratch layer: the unscratched acorn shells, cut to the 14 reveal windows; a finger erases them. */
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.stage.showback #scratch,.stage.showback #crumbs{display:none}
#symbols{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage.showback #symbols{display:none}
#crumbs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sand{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:20}
.controls{display:flex;gap:8px;justify-content:center;margin:12px auto 0}
.controls button{font:600 14px system-ui,-apple-system,sans-serif;padding:10px 16px;border-radius:10px;border:2px solid #b8822f;background:#2a1a0c;color:#f6dfb0;touch-action:manipulation}
.controls button:active{transform:translateY(1px)}
.flip{position:absolute;z-index:3;top:1.8%;right:2.4%;width:14.6%;height:9.6%;border:0;background:transparent;
 cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.flip:focus-visible{outline:3px solid #d8b46a;border-radius:4px;outline-offset:2px}
.result{font:700 17px system-ui,-apple-system,sans-serif;color:#f6dfb0;margin:12px auto 0;min-height:22px;font-variant-numeric:tabular-nums}
.result.win{color:#7fe35a}.result.lose{color:#c6dac7}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;color:#a9c2ab;font-size:13px;margin:10px auto 0;font-variant-numeric:tabular-nums}
.stats b{color:#f6dfb0}
.hint{font-size:12px;line-height:1.5;max-width:340px;margin:12px auto 0;padding:0 10px;color:#c6dac7}
.hint b{color:#f0d3a2}
</style>
<script>(function(){try{var w=Math.round(Math.min((screen.width||390)*0.82,420));document.documentElement.style.setProperty('--ticket-w',w+'px');}catch(e){}})();</script>
</head>
<body>
<main>
<div class="stage" id="ticket">
<div class="inner">
<img id="front" src="secret-squirrels-front.webp?v=3.17.0" alt="Secret Squirrels two-dollar scratch-off ticket front: two bonus acorns and twelve acorns to scratch." draggable="false">
<img id="back" src="secret-squirrels-back.webp?v=3.17.0" alt="Secret Squirrels back. Blank wooden instructions area and three military squirrels." draggable="false" hidden>
<canvas id="symbols" width="1024" height="1536"></canvas>
<canvas id="scratch" width="1024" height="1536" aria-label="Scratch the acorns to reveal what is inside"></canvas>
<canvas id="crumbs" width="1024" height="1536"></canvas>
</div>
<button type="button" class="flip" id="flip" aria-label="Flip ticket to back" title="Flip ticket"></button>
</div>
<div class="result" id="result" aria-live="polite"></div>
<div class="controls"><button type="button" id="newTicket">🎟️ New ticket</button></div>
<div class="stats" id="stats"></div>
<p class="hint"><b>How to play:</b> match a symbol in your row to that row's winning symbol on the left and win $1 for each match. Each bonus sack pays $0, $1, $5 or $10, and everything adds up. All 9 matches plus two overflowing sacks is the <b>$200 SUPER JACKPOT</b>. Tap the arrow in the corner to flip the ticket.</p>
</main>
<canvas id="sand" aria-hidden="true"></canvas>
<script src="secret-squirrels-odds.js?v=3.17.0"></script>
<script>
(function(){
'use strict';
const front=document.getElementById('front'),back=document.getElementById('back'),flip=document.getElementById('flip');
let showingBack=false;
const stage=document.getElementById('ticket');
// Fossil Finders' flip sound: an 8-bit card swish plus a short rising blip (Web Audio, no sound files).
let A=null;
function flipSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;A=A||new C();if(A.state==='suspended')A.resume();
 const m=A.createGain();m.gain.value=.9;m.connect(A.destination);const t=A.currentTime;
 const len=Math.floor(A.sampleRate*.09),b=A.createBuffer(1,len,A.sampleRate),d=b.getChannelData(0);let v=0;
 for(let i=0;i<len;i++){if(i%2===0)v=Math.random()*2-1;d[i]=v;}
 const n=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();n.buffer=b;f.type='bandpass';f.Q.value=1.2;
 f.frequency.setValueAtTime(700,t);f.frequency.exponentialRampToValueAtTime(3500,t+.09);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.0001,t+.09);
 n.connect(f);f.connect(g);g.connect(m);n.start(t);n.stop(t+.11);
 const o=A.createOscillator(),og=A.createGain(),t2=t+.05;o.type='square';o.frequency.setValueAtTime(660,t2);o.frequency.exponentialRampToValueAtTime(990,t2+.06);
 og.gain.setValueAtTime(.0001,t2);og.gain.exponentialRampToValueAtTime(.05,t2+.003);og.gain.exponentialRampToValueAtTime(.0001,t2+.06);
 o.connect(og);og.connect(m);o.start(t2);o.stop(t2+.09);}catch(err){}}
flip.addEventListener('click',function(){
 if(stage.classList.contains('flipping'))return;
 flipSound();stage.classList.add('flipping');
 setTimeout(function(){showingBack=!showingBack;front.hidden=showingBack;back.hidden=!showingBack;
  stage.classList.toggle('showback',showingBack);
  flip.setAttribute('aria-label',showingBack?'Flip ticket to front':'Flip ticket to back');},330);
 setTimeout(function(){stage.classList.remove('flipping');},670);
});

// ---------- Scratch mechanic ----------
// Reveal windows on the 1024x1536 ticket (plain data so the game can copy it).
// kind: winning = left column, yours = the 9 to the right, bonus = the two big acorns.
const WINDOWS=[
 {id:'bonusL',kind:'bonus',x:104,y:447,w:186,h:190},{id:'bonusR',kind:'bonus',x:734,y:447,w:186,h:190},
 {id:'r1c1',kind:'winning',x:116,y:803,w:140,h:140},{id:'r1c2',kind:'yours',x:382,y:803,w:140,h:140},{id:'r1c3',kind:'yours',x:588,y:802,w:140,h:140},{id:'r1c4',kind:'yours',x:793,y:803,w:140,h:140},
 {id:'r2c1',kind:'winning',x:119,y:983,w:140,h:140},{id:'r2c2',kind:'yours',x:389,y:982,w:140,h:140},{id:'r2c3',kind:'yours',x:593,y:982,w:140,h:140},{id:'r2c4',kind:'yours',x:790,y:982,w:140,h:140},
 {id:'r3c1',kind:'winning',x:117,y:1163,w:140,h:140},{id:'r3c2',kind:'yours',x:381,y:1161,w:140,h:140},{id:'r3c3',kind:'yours',x:588,y:1161,w:140,h:140},{id:'r3c4',kind:'yours',x:792,y:1160,w:140,h:140}];
// Scratch feel (plain numbers so the game can copy them):
// cell = size of the grid used to count what is scratched and to make grains, brush = finger radius (a perfect circle),
// grain = chance a scratched cell becomes a falling grain. Only what the finger touches comes off (no auto-reveal).
// stick = chance a falling grain lands on the ticket as a crumb (the mess), all in 1024x1536 ticket pixels.
const SCRATCH={cell:4,brush:28,grain:0.55,stick:0.2};
const cv=document.getElementById('scratch'),cx=cv.getContext('2d'),cover=new Image();
const crumbsCv=document.getElementById('crumbs'),crumbs=crumbsCv.getContext('2d');
const sand=document.getElementById('sand'),sx=sand.getContext('2d');
let cells=[],dragging=false,last=null,lastSfx=0,coverPx=null,grains=[],seed=1,raf=0,vel={x:0,y:0};
// seeded random so the same ticket scatters the same way (no hidden randomness in play)
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
// The 10 symbols, in the order of secret-squirrels-symbols.png (120 px cells).
const SYMBOLS=['acorn','binoculars','oak-leaf','pinecone','sack-of-nuts','walkie-talkie','slingshot','walnut','squirrel-tail','tnt'];
const SYM={cell:120,size:112};                // drawn 112 px inside the 140 px boxes
// Bonus sacks in the order of secret-squirrels-sacks.png; their values come from SS_ODDS.RULES.sackValues ($0/$1/$5/$10).
const SACKS=['empty','few','half','overflowing'];
const SACK={w:156,h:158};                      // secret-squirrels-sacks.png: 4 cells, each sack as big as the box allows
const sackSheet=new Image();
const symSheet=new Image(),symCv=document.getElementById('symbols'),symCx=symCv.getContext('2d');
const RULES=SS_ODDS.RULES;
// Unbiased random numbers for the real deal (the offline simulation uses a seeded generator with the same dealer).
const cryptoRand=()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;
let ticket=null;
// Which symbol or sack sits under each window, from the ticket dealt at purchase.
function contentOf(id){if(id==='bonusL')return {sack:ticket.sacks[0]};if(id==='bonusR')return {sack:ticket.sacks[1]};
 const r=+id[1]-1,c=+id[3]-1;return {sym:c===0?ticket.winning[r]:ticket.yours[r][c-1]};}
function drawContents(){
 symCx.clearRect(0,0,1024,1536);if(!ticket)return;
 for(const w of WINDOWS){const k=contentOf(w.id);
  if('sack' in k){const i=RULES.sackValues.indexOf(k.sack);
   if(sackSheet.complete&&sackSheet.naturalWidth)symCx.drawImage(sackSheet,i*SACK.w,0,SACK.w,SACK.h,w.x+(w.w-SACK.w)/2,w.y+(w.h-SACK.h)/2-10,SACK.w,SACK.h);/* raised 10 px: centred in the frame */}
  else{const i=RULES.symbols.indexOf(k.sym);
   if(symSheet.complete&&symSheet.naturalWidth)symCx.drawImage(symSheet,i*SYM.cell,0,SYM.cell,SYM.cell,w.x+(w.w-SYM.size)/2,w.y+(w.h-SYM.size)/2,SYM.size,SYM.size);}}
}
symSheet.onload=drawContents;sackSheet.onload=drawContents;sackSheet.src='secret-squirrels-sacks.png?v=3.16.1d';symSheet.src='secret-squirrels-symbols.png?v=3.16.1b';
// ---------- Ticket, money and results ----------
// A box counts as seen once SEEN_AT of its middle (inner 70%, where the symbol sits) is scratched.
const SEEN_AT=0.6;
const STATS_KEY='secret-squirrels-stats';
let stats={spent:0,won:0},paid=false,finished=false,forced=null;
try{const v=JSON.parse(localStorage.getItem(STATS_KEY));if(v&&typeof v.spent==='number')stats=v;}catch(err){}
const saveStats=()=>{try{localStorage.setItem(STATS_KEY,JSON.stringify(stats));}catch(err){}};
const money=v=>(v<0?'−$':'$')+Math.abs(v);
const resultEl=document.getElementById('result'),statsEl=document.getElementById('stats');
function renderStats(){const net=stats.won-stats.spent;statsEl.innerHTML=`<span>Spent <b>${money(stats.spent)}</b></span><span>Won <b>${money(stats.won)}</b></span><span>Net <b>${net>0?'+':''}${money(net)}</b></span>`;}
function seen(id){const c=cells.find(x=>x.w.id===id);return !!(c&&c.seen);}
// Money shown so far: a $1 match counts once both its symbol and its row's winning symbol are seen; a sack once it is seen.
function wonSoFar(){let m=0,b=0;
 for(let r=0;r<3;r++){if(!seen(`r${r+1}c1`))continue;for(let c=0;c<3;c++)if(seen(`r${r+1}c${c+2}`)&&ticket.yours[r][c]===ticket.winning[r])m++;}
 if(seen('bonusL'))b+=ticket.sacks[0];if(seen('bonusR'))b+=ticket.sacks[1];
 return {m,b,total:m*RULES.matchPays+b};}
function renderResult(){
 if(!paid){resultEl.className='result';resultEl.textContent='Scratch any acorn to play · $2';return;}
 if(cells.every(c=>c.seen)){
  if(!finished){finished=true;stats.won+=ticket.total;saveStats();renderStats();}
  resultEl.className='result '+(ticket.total>0?'win':'lose');
  resultEl.textContent=ticket.jackpot?'SUPER JACKPOT! You won $200':ticket.total>0?`You won ${money(ticket.total)}`:'No win this time';return;}
 const s=wonSoFar();resultEl.className='result';
 resultEl.textContent=`Won so far: ${money(s.total)}`+(s.m||s.b?`  (${s.m} match${s.m===1?'':'es'}${s.b?` + ${money(s.b)} in sacks`:''})`:'');}
function onScratched(){if(!paid){paid=true;stats.spent+=RULES.price;saveStats();renderStats();}}
function setup(){
 // A ticket left unfinished still pays what is printed on it, like a real ticket.
 if(ticket&&paid&&!finished){stats.won+=ticket.total;saveStats();}
 ticket=forced||SS_ODDS.deal(cryptoRand);forced=null;paid=false;finished=false;drawContents();renderStats();
 seed=20261124;grains=[];cx.clearRect(0,0,1024,1536);crumbs.clearRect(0,0,1024,1536);
 if(!coverPx){const o=document.createElement('canvas');o.width=1024;o.height=1536;const oc=o.getContext('2d');oc.drawImage(cover,0,0);coverPx=oc.getImageData(0,0,1024,1536).data;}
 cells=WINDOWS.map(w=>{const cols=Math.ceil(w.w/SCRATCH.cell),rows=Math.ceil(w.h/SCRATCH.cell);
  cx.drawImage(cover,w.x-4,w.y-4,w.w+8,w.h+8,w.x-4,w.y-4,w.w+8,w.h+8);   // 4 px margin hides the edge seam (same pixels as the ticket)
  const mid=[];for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){const fx=(q+.5)/cols,fy=(r+.5)/rows;if(fx>.15&&fx<.85&&fy>.15&&fy<.85)mid.push(r*cols+q);}
  return {w,cols,rows,left:cols*rows,gone:new Uint8Array(cols*rows),mid,seen:false};});
 renderResult();
}
function colorAt(x,y){const i=((y|0)*1024+(x|0))*4;return coverPx?`rgb(${coverPx[i]},${coverPx[i+1]},${coverPx[i+2]})`:'#c8701c';}
function clearCell(c,i,burst){if(c.gone[i])return;c.gone[i]=1;c.left--;
 const S=SCRATCH.cell,x=c.w.x+(i%c.cols)*S,y=c.w.y+Math.floor(i/c.cols)*S;
 if(rnd()<SCRATCH.grain)spawn(x+S/2,y+S/2,burst);}
// a grain: ticket-pixel position, velocity in ticket px per second; it follows the finger a little, then gravity takes it
function spawn(x,y,burst){if(grains.length>2600)return;
 const big=rnd()<0.25;
 grains.push({x,y,vx:vel.x*0.18+(rnd()-0.5)*(burst?260:140),vy:vel.y*0.18-rnd()*(burst?220:120),
  s:big?12:6,c:colorAt(x,y),stick:rnd()<SCRATCH.stick,land:y+20+rnd()*90,t:0,life:1.1+rnd()*0.7});
 if(!raf)raf=requestAnimationFrame(tick);}
function inWindow(x,y){return WINDOWS.some(w=>x>=w.x-6&&x<=w.x+w.w+6&&y>=w.y-6&&y<=w.y+w.h+6);}
let lastT=0;
function tick(now){
 const dt=Math.min(0.05,lastT?(now-lastT)/1000:0.016);lastT=now;
 // the sand layer covers the whole page so grains can tumble off the ticket's edge
 const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=Math.max(innerHeight,document.documentElement.scrollHeight);
 if(sand.width!==Math.round(W*dpr)||sand.height!==Math.round(innerHeight*dpr)){sand.width=Math.round(W*dpr);sand.height=Math.round(innerHeight*dpr);}
 sx.setTransform(dpr,0,0,dpr,0,0);sx.clearRect(0,0,W,innerHeight);
 const b=cv.getBoundingClientRect(),k=b.width/1024;
 const keep=[];
 for(const g of grains){
  g.t+=dt;g.vy+=1900*dt;g.vx*=Math.pow(0.35,dt);g.x+=g.vx*dt;g.y+=g.vy*dt;
  if(g.stick&&g.vy>0&&g.y>=g.land){ // lands on the ticket and stays: the mess
   if(g.x>8&&g.x<1016&&g.y<1528&&!inWindow(g.x,g.y)){crumbs.fillStyle=g.c;crumbs.fillStyle='rgba(20,10,4,.55)';crumbs.fillRect(Math.round(g.x/4)*4+2,Math.round(g.y/4)*4+2,g.s,g.s);crumbs.fillStyle=g.c;crumbs.fillRect(Math.round(g.x/4)*4,Math.round(g.y/4)*4,g.s,g.s);}
   continue;}
  const px=b.left+g.x*k,py=b.top+g.y*k;
  if(py>innerHeight+10||g.t>g.life)continue;
  const fade=Math.min(1,(g.life-g.t)/0.3);
  sx.globalAlpha=fade;sx.fillStyle=g.c;const s=Math.max(1.5,g.s*k);sx.fillRect(px-s/2,py-s/2,s,s);
  keep.push(g);}
 sx.globalAlpha=1;grains=keep;
 raf=grains.length?requestAnimationFrame(tick):0;if(!raf){lastT=0;sx.clearRect(0,0,W,innerHeight);}
}
function scratchAt(px,py){
 const R=SCRATCH.brush,S=SCRATCH.cell;let hit=false,changed=false;
 for(const c of cells){const w=c.w;if(px<w.x-R||px>w.x+w.w+R||py<w.y-R||py>w.y+w.h+R)continue;
  // erase a perfect circle, kept inside this window
  cx.save();cx.beginPath();cx.rect(w.x,w.y,w.w,w.h);cx.clip();cx.globalCompositeOperation='destination-out';
  cx.beginPath();cx.arc(px,py,R,0,Math.PI*2);cx.fill();cx.restore();
  const q0=Math.max(0,Math.floor((px-R-w.x)/S)),q1=Math.min(c.cols-1,Math.floor((px+R-w.x)/S));
  const r0=Math.max(0,Math.floor((py-R-w.y)/S)),r1=Math.min(c.rows-1,Math.floor((py+R-w.y)/S));
  for(let r=r0;r<=r1;r++)for(let q=q0;q<=q1;q++){const i=r*c.cols+q;if(c.gone[i])continue;
   const mx=w.x+q*S+S/2,my=w.y+r*S+S/2;
   if((mx-px)**2+(my-py)**2<=R*R){clearCell(c,i,false);hit=true;}}
  if(!c.seen&&c.mid.filter(i=>c.gone[i]).length>=SEEN_AT*c.mid.length){c.seen=true;changed=true;}}
 if(hit){scratchSound();onScratched();}
 if(hit||changed)renderResult();}
function toTicket(e){const b=cv.getBoundingClientRect();return {x:(e.clientX-b.left)/b.width*1024,y:(e.clientY-b.top)/b.height*1536,t:e.timeStamp};}
function stroke(p){if(!last){scratchAt(p.x,p.y);last=p;return;}
 const d=Math.hypot(p.x-last.x,p.y-last.y),dt=Math.max(1,p.t-last.t)/1000;
 vel={x:vel.x*0.5+(p.x-last.x)/dt*0.5,y:vel.y*0.5+(p.y-last.y)/dt*0.5};
 const n=Math.max(1,Math.ceil(d/3));               // a dab every 3 ticket px: no gaps between finger samples
 for(let k=1;k<=n;k++)scratchAt(last.x+(p.x-last.x)*k/n,last.y+(p.y-last.y)*k/n);last=p;}
cv.addEventListener('pointerdown',e=>{if(e.button>0)return;dragging=true;last=null;vel={x:0,y:0};try{cv.setPointerCapture(e.pointerId)}catch(err){}stroke(toTicket(e));e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(!dragging)return;
 const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];   // every finger sample, not just one per frame
 for(const ev of (evs.length?evs:[e]))stroke(toTicket(ev));e.preventDefault();});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>cv.addEventListener(t,()=>{dragging=false;last=null;}));
function scratchSound(){const now=performance.now();if(now-lastSfx<55)return;lastSfx=now;
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;A=A||new C();if(A.state==='suspended')A.resume();const t=A.currentTime;
 const len=Math.floor(A.sampleRate*.06),b=A.createBuffer(1,len,A.sampleRate),d=b.getChannelData(0);let v=0;for(let i=0;i<len;i++){if(i%2===0)v=Math.random()*2-1;d[i]=v*(0.6+0.4*Math.random());}
 const n=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();n.buffer=b;f.type='bandpass';f.frequency.value=3200+Math.random()*1400;f.Q.value=0.8;
 g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);n.connect(f);f.connect(g);g.connect(A.destination);n.start(t);n.stop(t+.07);}catch(err){}}
cover.onload=setup;cover.src='secret-squirrels-cover.webp?v=3.17.0';
document.getElementById('newTicket').addEventListener('click',()=>{if(showingBack)flip.click();if(cover.complete)setup();});
window.__secretSquirrels={WINDOWS,SCRATCH,RULES,ticket:()=>ticket,stats:()=>({...stats}),forceTicket:t=>{forced=t;setup();},result:()=>resultEl.textContent,seen:()=>cells.filter(c=>c.seen).map(c=>c.w.id),scratchAt,reset:setup,grains:()=>grains.length,revealed:()=>cells.filter(c=>c.left===0).map(c=>c.w.id),progress:()=>cells.map(c=>+(1-c.left/c.gone.length).toFixed(2))};
function sendHeight(){try{parent.postMessage({secretSquirrelsHeight:Math.ceil(document.querySelector('main').getBoundingClientRect().bottom)+8},location.origin)}catch(err){}}
addEventListener('load',sendHeight);addEventListener('resize',sendHeight);sendHeight();
})();
</script>
</body>
</html>
